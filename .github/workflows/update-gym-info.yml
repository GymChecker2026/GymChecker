name: Update gym set info

on:
  schedule:
    # 毎時0分・18:00 UTC はGitHub Actions側のキューが混雑しやすく、
    # 遅延（実績で1〜2時間）や発火自体の破棄が起きるため、ずらした時刻を主枠にする。
    # 03:30〜04:30 JST 着地を狙う主枠。
    - cron: "37 17 * * *"
    # 主枠が破棄された場合の保険となる予備枠。
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gym-info
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 anthropic jpholiday

      - name: Extract events
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python extract_events.py

      - name: Fetch ROCKY calendars
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python rocky_fetch.py

      - name: Build display data
        if: always()
        run: python build_display.py

      - name: Build HTML
        if: always()
        run: python build_html.py

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed.json events.json collection_status.json display.json index.html manual_events.json rocky_state.json rocky_status.json pending_review.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update gym set info ($(TZ=Asia/Tokyo date +'%Y-%m-%dT%H:%M:%S%z'))"
            git push
          fi
