name: Update gym set info

on:
  schedule:
    # 18:00 UTC = 03:00 JST
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gym-info
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 anthropic jpholiday

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python extract_events.py
          python rocky_fetch.py
          python build_display.py
          python build_html.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed.json events.json collection_status.json display.json index.html manual_events.json rocky_state.json rocky_status.json pending_review.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update gym set info ($(TZ=Asia/Tokyo date +'%Y-%m-%dT%H:%M:%S%z'))"
            git push
          fi
