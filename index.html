<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ジムチェッカー</title>
<style>
:root {
  --bg: #f3efe8;
  --surface: #ffffff;
  --surface-2: #faf7f2;
  --ink: #24211d;
  --ink-dim: #6b6459;
  --line: #e4ddd1;
  --accent: #d45e2a;
  --accent-ink: #ffffff;
  --accent-tint: #fbe8dd;

  --type-closed: #b34a3e;
  --type-hours: #a5791f;
  --type-area: #3a6ea5;
  --type-set: #3e7d52;
  --type-event: #6b4e9e;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1a17;
    --surface: #262320;
    --surface-2: #2d2a26;
    --ink: #f0ece4;
    --ink-dim: #a89f8f;
    --line: #3a3630;
    --accent: #ef814a;
    --accent-ink: #1c1a17;
    --accent-tint: #3a2a20;

    --type-closed: #e07b6f;
    --type-hours: #d4a94a;
    --type-area: #6fa0d8;
    --type-set: #6bb883;
    --type-event: #a084d1;
  }
}

:root[data-theme="dark"] {
  --bg: #1c1a17;
  --surface: #262320;
  --surface-2: #2d2a26;
  --ink: #f0ece4;
  --ink-dim: #a89f8f;
  --line: #3a3630;
  --accent: #ef814a;
  --accent-ink: #1c1a17;
  --accent-tint: #3a2a20;

  --type-closed: #e07b6f;
  --type-hours: #d4a94a;
  --type-area: #6fa0d8;
  --type-set: #6bb883;
  --type-event: #a084d1;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
}

.page {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 0 5rem;
  min-height: 100vh;
}

.masthead {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  padding: 1.1rem 1.25rem 0.9rem;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.masthead h1 {
  margin: 0;
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.menu-wrap {
  position: relative;
  flex: none;
}

.menu-wrap[hidden] { display: none; }

.menu-btn {
  width: 2.1rem;
  height: 2.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-dim);
  font-size: 1.2rem;
  line-height: 1;
  font-family: inherit;
  cursor: pointer;
}

.menu-btn:hover,
.menu-btn:focus-visible {
  border-color: var(--accent);
  color: var(--accent);
  outline: none;
}

.menu-popover {
  position: absolute;
  top: calc(100% + 0.5rem);
  right: 0;
  z-index: 30;
  min-width: 11rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  padding: 0.4rem;
}

.menu-popover[hidden] { display: none; }

.menu-label {
  margin: 0.35rem 0.6rem 0.2rem;
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--ink-dim);
}

.menu-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 0.5rem 0.6rem;
  border: none;
  background: none;
  border-radius: 8px;
  font-size: 0.85rem;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
}

.menu-item:hover,
.menu-item:focus-visible {
  background: var(--surface-2);
  outline: none;
}

.menu-item.active {
  color: var(--accent);
  font-weight: 700;
}

.menu-item.active::after {
  content: " \2713";
}

.menu-divider {
  height: 1px;
  background: var(--line);
  margin: 0.4rem 0.2rem;
}

.menu-item-danger {
  color: var(--type-closed);
}

.settings-note {
  margin: 3.5rem 1.25rem;
  text-align: center;
  color: var(--ink-dim);
  font-size: 0.9rem;
  line-height: 1.6;
}

.tab-panel[hidden] { display: none; }

.search-bar {
  padding: 1rem 1.25rem 0;
}

.search-bar input {
  width: 100%;
  padding: 0.65rem 0.85rem;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 0.9rem;
  font-family: inherit;
}

.search-bar input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.chain-filter {
  display: flex;
  gap: 0.4rem;
  padding: 0.75rem 1.25rem 0;
  overflow-x: auto;
}

.chain-btn {
  flex: none;
  padding: 0.4rem 0.85rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-dim);
  font-size: 0.78rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}

.chain-btn.active {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
}

.empty-state {
  margin: 3.5rem 1.25rem;
  text-align: center;
  color: var(--ink-dim);
  font-size: 0.9rem;
  line-height: 1.6;
}

.cards {
  padding: 1rem 1.25rem 0;
  display: flex;
  flex-direction: column;
  gap: 0.875rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1rem 1.1rem 1.1rem;
  overflow: hidden;
}

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.6rem;
  margin-bottom: 0.75rem;
}

.card-head h2 {
  margin: 0;
  font-size: 1.15rem;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.star-btn {
  flex: none;
  width: 2.1rem;
  height: 2.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-dim);
  font-size: 1.15rem;
  line-height: 1;
  font-family: inherit;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
}

.star-btn.active {
  border-color: var(--accent);
  background: var(--accent-tint);
  color: var(--accent);
}

.info-grid {
  margin: 0 0 0.9rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem 0.75rem;
  background: var(--surface-2);
  border-radius: 10px;
  padding: 0.7rem 0.8rem;
}

.info-item dt {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--ink-dim);
  margin-bottom: 0.15rem;
}

.info-item dd {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.4;
}

.no-data {
  color: var(--ink-dim);
  font-style: italic;
  font-size: 0.8rem;
}

.events {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.fetched-at {
  margin: 0.6rem 0 0;
  font-size: 0.68rem;
  color: var(--ink-dim);
  text-align: right;
}

.no-events {
  margin: 0.2rem 0 0;
  font-size: 0.82rem;
  color: var(--ink-dim);
}

.data-note {
  margin: 0.6rem 0 0;
  padding: 0.55rem 0.7rem;
  border-radius: 9px;
  background: var(--surface-2);
  color: var(--ink-dim);
  font-size: 0.76rem;
  line-height: 1.4;
}

.link-row {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.8rem;
}

.site-link {
  flex: 1;
  text-align: center;
  padding: 0.5rem 0.6rem;
  border-radius: 8px;
  border: 1px solid var(--line);
  color: var(--ink);
  text-decoration: none;
  font-size: 0.78rem;
  font-weight: 700;
  transition: border-color 0.15s ease, color 0.15s ease;
}

.site-link:hover,
.site-link:focus-visible {
  border-color: var(--accent);
  color: var(--accent);
  outline: none;
}

.event-row {
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  align-items: center;
  gap: 0.5rem;
  padding: 0.55rem 0.6rem;
  border-radius: 9px;
  text-decoration: none;
  color: inherit;
  border: 1px solid var(--line);
  transition: border-color 0.15s ease, background 0.15s ease;
}

.event-row:hover,
.event-row:focus-visible {
  border-color: var(--accent);
  background: var(--surface-2);
  outline: none;
}

.event-date {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--ink-dim);
  min-width: 2.6em;
}

.event-type {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  padding: 0.15rem 0.45rem;
  border-radius: 999px;
  color: #fff;
  white-space: nowrap;
}
.type-closed { background: var(--type-closed); }
.type-hours  { background: var(--type-hours); }
.type-area   { background: var(--type-area); }
.type-set    { background: var(--type-set); }
.type-event  { background: var(--type-event); }

.event-note {
  font-size: 0.82rem;
  line-height: 1.35;
  min-width: 0;
  overflow-wrap: break-word;
}

.event-arrow {
  color: var(--accent);
  font-size: 0.85rem;
}

footer.note {
  padding: 1.5rem 1.25rem 0;
  text-align: center;
}

footer.note .generated {
  margin: 0;
  font-size: 0.72rem;
  color: var(--ink-dim);
}

footer.note .disclaimer {
  margin: 0.4rem 0 0;
  font-size: 0.66rem;
  line-height: 1.5;
  color: var(--ink-dim);
  opacity: 0.8;
}

.tabbar {
  position: fixed;
  left: 50%;
  bottom: 0;
  width: 100%;
  max-width: 560px;
  transform: translateX(-50%);
  z-index: 20;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.tab-btn {
  flex: 1;
  border: none;
  background: none;
  padding: 0.7rem 0.5rem;
  font-size: 0.78rem;
  font-weight: 700;
  font-family: inherit;
  color: var(--ink-dim);
  cursor: pointer;
}

.tab-btn.active {
  color: var(--accent);
}

@media (max-width: 360px) {
  .info-grid { grid-template-columns: 1fr; }
  .event-row { grid-template-columns: auto auto 1fr; }
  .event-arrow { display: none; }
}
</style>

<div class="page">

    <h1 id="tab-title">マイリスト</h1>

      <div class="menu-popover" id="mylist-menu" hidden></div>
    </div>
  </header>

  <main id="tab-mylist" class="tab-panel"></main>

  <main id="tab-search" class="tab-panel" hidden>
    <div class="search-bar">
      <input id="search-input" type="search" placeholder="ジムを検索" autocomplete="off">
    </div>
    <div id="chain-filter" class="chain-filter"></div>
    <div id="search-cards" class="cards"></div>
  </main>

  <main id="tab-settings" class="tab-panel" hidden>
    <p class="settings-note">通知設定は今後追加予定です。</p>
  </main>
</div>

<nav class="tabbar">

  <button type="button" class="tab-btn" data-tab="search">検索</button>
  <button type="button" class="tab-btn" data-tab="settings">設定</button>
</nav>

    var fetchedLabel = fmtFetchedAt(gym.fetched_at);
    var fetchedHtml = fetchedLabel ? '<p class="fetched-at">' + escapeHtml(fetchedLabel) + '</p>' : "";

    return '<article class="card" data-gym-id="' + escapeHtml(gym.gym_id) + '">' +
      '<header class="card-head">' +
        '<h2>' + escapeHtml(displayName) + '</h2>' +
        '<button type="button" class="star-btn' + (fav ? " active" : "") + '" data-fav-toggle="' + escapeHtml(gym.gym_id) + '" aria-pressed="' + fav + '" aria-label="マイリストに追加・削除">' + (fav ? "&#9733;" : "&#9734;") + '</button>' +
      '</header>' +
      '<dl class="info-grid">' +
        '<div class="info-item"><dt>営業時間</dt><dd>' + fieldHtml(gym.hours) + '</dd></div>' +
        '<div class="info-item"><dt>定休日</dt><dd>' + fieldHtml(gym.closed_days) + '</dd></div>' +
        '<div class="info-item"><dt>最寄り駅</dt><dd>' + fieldHtml(gym.station) + '</dd></div>' +
        '<div class="info-item"><dt>路線</dt><dd>' + fieldHtml(gym.line) + '</dd></div>' +
      '</dl>' +
      '<div class="events">' + eventsSectionHtml(gym) + '</div>' +
      noteHtml +
      linkRowHtml(gym) +
      fetchedHtml +
      '</article>';
  }

  // =========================================================
  // 描画層（タブ単位）
  // =========================================================
  function renderMyListTab() {
    var container = document.getElementById("tab-mylist");
    var gyms = fetchGyms();
    var byId = {};
    gyms.forEach(function (g) { byId[g.gym_id] = g; });
    var ids = getFavoriteIds();
    var list = ids.map(function (id) { return byId[id]; }).filter(Boolean);

    if (getSortOrder() === "name") {
      list = list.slice().sort(function (a, b) {
        var an = a.display_name || a.name;
        var bn = b.display_name || b.name;
        return an.localeCompare(bn, "ja");
      });
    }

    var bodyHtml;
    if (list.length === 0) {
      bodyHtml = '<p class="empty-state">検索タブからジムを追加してください</p>';
    } else {
      bodyHtml = '<div class="cards">' + list.map(gymCardHtml).join("") + '</div>';
    }

    container.innerHTML = bodyHtml +
      '<footer class="note">' +
        '<p class="generated">' + escapeHtml(GENERATED_AT) + ' 時点</p>' +
        '<p class="disclaimer">掲載情報は自動収集したものです。正確性・網羅性を保証しません。ご利用前に必ず公式サイトでご確認ください。</p>' +
      '</footer>';
  }

  var CHAIN_OPTIONS = [
    { key: "all", label: "すべて" },
    { key: "NOBOROCK", label: "ノボロック" },
    { key: "D-BOULDERING", label: "Dボルダリング" },
    { key: "pump", label: "pump" }
  ];

  var searchState = { query: "", chain: "all" };

  function renderChainFilter() {
    var container = document.getElementById("chain-filter");
    container.innerHTML = CHAIN_OPTIONS.map(function (c) {
      var active = c.key === searchState.chain ? " active" : "";
      return '<button type="button" class="chain-btn' + active + '" data-chain="' + c.key + '">' + c.label + '</button>';
    }).join("");
  }

  function renderSearchCards() {
    var container = document.getElementById("search-cards");
    var gyms = fetchGyms();
    var q = searchState.query.trim().toLowerCase();
    var filtered = gyms.filter(function (g) {
      if (searchState.chain !== "all" && g.chain !== searchState.chain) return false;
      if (!q) return true;
      var name = (g.display_name || g.name || "").toLowerCase();
      return name.indexOf(q) !== -1;
    });
    container.innerHTML = filtered.map(gymCardHtml).join("");
  }

  function renderSearchTab() {
    renderChainFilter();
    renderSearchCards();
  }

  function renderMylistMenu() {
    var menu = document.getElementById("mylist-menu");
    var sort = getSortOrder();
    menu.innerHTML =
      '<p class="menu-label">並び順</p>' +
      '<button type="button" class="menu-item' + (sort === "added" ? " active" : "") + '" data-sort="added">追加順</button>' +
      '<button type="button" class="menu-item' + (sort === "name" ? " active" : "") + '" data-sort="name">名前順</button>' +
      '<div class="menu-divider"></div>' +
      '<button type="button" class="menu-item menu-item-danger" id="mylist-clear-btn">マイリストを全削除</button>';
  }

  function toggleMylistMenu(force) {
    var menu = document.getElementById("mylist-menu");
    var btn = document.getElementById("mylist-menu-btn");
    var show = typeof force === "boolean" ? force : menu.hidden;
    if (show) renderMylistMenu();
    menu.hidden = !show;
    btn.setAttribute("aria-expanded", String(show));
  }

  // =========================================================
  // 状態管理・イベント配線（コントローラ）
  // =========================================================
  var TAB_LABELS = { mylist: "マイリスト", search: "検索", settings: "設定" };

  function switchTab(tab) {
    document.getElementById("tab-mylist").hidden = tab !== "mylist";
    document.getElementById("tab-search").hidden = tab !== "search";
    document.getElementById("tab-settings").hidden = tab !== "settings";
    document.querySelectorAll(".tab-btn").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-tab") === tab);
    });
    document.getElementById("tab-title").textContent = TAB_LABELS[tab] || "";
    document.getElementById("mylist-menu-wrap").hidden = tab !== "mylist";
    if (tab !== "mylist") toggleMylistMenu(false);
    if (tab === "mylist") renderMyListTab();
  }

  document.addEventListener("click", function (e) {
    var tabBtn = e.target.closest(".tab-btn");
    if (tabBtn) {
      switchTab(tabBtn.getAttribute("data-tab"));
      return;
    }
    var chainBtn = e.target.closest(".chain-btn");
    if (chainBtn) {
      searchState.chain = chainBtn.getAttribute("data-chain");
      renderSearchTab();
      return;
    }
    var favBtn = e.target.closest("[data-fav-toggle]");
    if (favBtn) {
      toggleFavorite(favBtn.getAttribute("data-fav-toggle"));
      renderMyListTab();
      renderSearchCards();
      return;
    }
    var menuBtn = e.target.closest("#mylist-menu-btn");
    if (menuBtn) {
      toggleMylistMenu();
      return;
    }
    var sortItem = e.target.closest(".menu-item[data-sort]");
    if (sortItem) {
      setSortOrder(sortItem.getAttribute("data-sort"));
      toggleMylistMenu(false);
      renderMyListTab();
      return;
    }
    var clearBtn = e.target.closest("#mylist-clear-btn");
    if (clearBtn) {
      toggleMylistMenu(false);
      if (window.confirm("マイリストを全て削除しますか？")) {
        setFavoriteIds([]);
        renderMyListTab();
        renderSearchCards();
      }
      return;
    }
    var insideMenu = e.target.closest("#mylist-menu-wrap");
    if (!insideMenu) {
      var menu = document.getElementById("mylist-menu");
      if (!menu.hidden) toggleMylistMenu(false);
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "search-input") {
      searchState.query = e.target.value;
      renderSearchCards();
    }
  });

  // =========================================================
  // 初期描画
  // =========================================================
  switchTab("mylist");
  renderSearchTab();
})();
</script>
