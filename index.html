<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ジムチェッカー</title>
<style>
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #eef1f7;
  --ink: #1b2036;
  --ink-dim: #5b6a8c;
  --line: #dbe1ee;
  --accent: #1c3177;
  --accent-ink: #ffffff;
  --accent-tint: #d3ddf4;

  --type-closed: #c0392b;
  --type-hours: #a85f18;
  --type-area: #7d5ba6;
  --type-set: #217d47;
  --type-event: #187a89;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131f;
    --surface: #1a2036;
    --surface-2: #212843;
    --ink: #eef1f8;
    --ink-dim: #96a1c4;
    --line: #2c3452;
    --accent: #6c86d6;
    --accent-ink: #10131f;
    --accent-tint: #232a4a;

    --type-closed: #e0685c;
    --type-hours: #dba05a;
    --type-area: #a687d1;
    --type-set: #5cc98a;
    --type-event: #4dbdd1;
  }
}

:root[data-theme="dark"] {
  --bg: #10131f;
  --surface: #1a2036;
  --surface-2: #212843;
  --ink: #eef1f8;
  --ink-dim: #96a1c4;
  --line: #2c3452;
  --accent: #6c86d6;
  --accent-ink: #10131f;
  --accent-tint: #232a4a;

  --type-closed: #e0685c;
  --type-hours: #dba05a;
  --type-area: #a687d1;
  --type-set: #5cc98a;
  --type-event: #4dbdd1;
}

* { box-sizing: border-box; }

html {
  overflow-y: scroll;
  scrollbar-gutter: stable;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
}

.page {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 0 6.5rem;
  min-height: 100vh;
}

.masthead {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  padding: 1.1rem 1.25rem 0.9rem;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.masthead h1 {
  margin: 0;
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.menu-wrap {
  position: relative;
  flex: none;
}

.menu-wrap[hidden] { display: none; }

.menu-btn {
  width: 2.1rem;
  height: 2.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-dim);
  font-size: 1.2rem;
  line-height: 1;
  font-family: inherit;
  cursor: pointer;
}

.menu-btn:hover,
.menu-btn:focus-visible {
  border-color: var(--accent);
  color: var(--accent);
  outline: none;
}

.menu-popover {
  position: absolute;
  top: calc(100% + 0.5rem);
  right: 0;
  z-index: 30;
  min-width: 11rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  padding: 0.4rem;
}

.menu-popover[hidden] { display: none; }

.menu-label {
  margin: 0.35rem 0.6rem 0.2rem;
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--ink-dim);
}

.menu-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 0.5rem 0.6rem;
  border: none;
  background: none;
  border-radius: 8px;
  font-size: 0.85rem;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
}

.menu-item:hover,
.menu-item:focus-visible {
  background: var(--surface-2);
  outline: none;
}

.menu-item.active {
  color: var(--accent);
  font-weight: 700;
}

.menu-item.active::after {
  content: " \2713";
}

.menu-divider {
  height: 1px;
  background: var(--line);
  margin: 0.4rem 0.2rem;
}

.menu-item-danger {
  color: var(--type-closed);
}

.settings-note {
  margin: 3.5rem 1.25rem;
  text-align: center;
  color: var(--ink-dim);
  font-size: 0.9rem;
  line-height: 1.6;
}

.tab-panel[hidden] { display: none; }

.search-bar {
  padding: 1rem 1.25rem 0;
}

.search-bar input {
  width: 100%;
  padding: 0.65rem 0.85rem;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 0.9rem;
  font-family: inherit;
}

.search-bar input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.chain-filter {
  display: flex;
  gap: 0.4rem;
  padding: 0.75rem 1.25rem 0;
  overflow-x: auto;
}

.chain-btn {
  flex: none;
  padding: 0.4rem 0.85rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-dim);
  font-size: 0.78rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}

.chain-btn.active {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
}

.empty-state {
  margin: 3.5rem 1.25rem;
  text-align: center;
  color: var(--ink-dim);
  font-size: 0.9rem;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.9rem;
}

.empty-state p {
  margin: 0;
}

.empty-state-btn {
  padding: 0.6rem 1.4rem;
  border-radius: 999px;
  border: none;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 0.85rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
}

.empty-state-btn:hover,
.empty-state-btn:focus-visible {
  opacity: 0.9;
  outline: none;
}

.cards {
  padding: 1rem 1.25rem 0;
  display: flex;
  flex-direction: column;
  gap: 0.875rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1rem 1.1rem 1.1rem;
  overflow: hidden;
}

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.6rem;
  margin-bottom: 0.75rem;
}

.card-head h2 {
  margin: 0;
  font-size: 1.15rem;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.star-btn {
  flex: none;
  width: 2.1rem;
  height: 2.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-dim);
  font-family: inherit;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
}

.star-btn.active {
  border-color: var(--accent);
  background: var(--accent-tint);
  color: var(--accent);
}

.star-icon {
  width: 20px;
  height: 20px;
  display: block;
}

.star-icon svg {
  width: 20px;
  height: 20px;
  display: block;
}

.star-icon .icon-solid { display: none; }
.star-btn.active .star-icon .icon-outline { display: none; }
.star-btn.active .star-icon .icon-solid { display: block; }

.hours-block {
  margin: 0 0 0.7rem;
  background: var(--surface-2);
  border-radius: 10px;
  padding: 0.7rem 0.8rem;
}

.hours-heading {
  margin: 0 0 0.45rem;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--ink-dim);
}

.hours-list {
  margin: 0;
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 0.9rem;
  row-gap: 0.35rem;
}

.hours-list dt {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
}

.hours-list dd {
  margin: 0;
  font-size: 0.82rem;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.hours-note {
  margin: 0.5rem 0 0;
  font-size: 0.7rem;
  line-height: 1.5;
  color: var(--ink-dim);
}

.info-grid {
  margin: 0 0 0.9rem;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem 0.75rem;
  background: var(--surface-2);
  border-radius: 10px;
  padding: 0.7rem 0.8rem;
}

.info-item dt {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--ink-dim);
  margin-bottom: 0.15rem;
}

.info-item dd {
  margin: 0;
  font-size: 0.85rem;
  line-height: 1.4;
}

.no-data {
  color: var(--ink-dim);
  font-style: italic;
  font-size: 0.8rem;
}

.events {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.fetched-at {
  margin: 0.6rem 0 0;
  font-size: 0.68rem;
  color: var(--ink-dim);
  text-align: right;
}

.last-changed {
  margin: 0.2rem 0 0;
  font-size: 0.68rem;
  color: var(--ink-dim);
  text-align: right;
}

.no-events {
  margin: 0.2rem 0 0;
  font-size: 0.82rem;
  color: var(--ink-dim);
}

.data-note {
  margin: 0.6rem 0 0;
  padding: 0.55rem 0.7rem;
  border-radius: 9px;
  background: var(--surface-2);
  color: var(--ink-dim);
  font-size: 0.76rem;
  line-height: 1.4;
}

.link-row {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.8rem;
}

.site-link {
  flex: 1;
  text-align: center;
  padding: 0.5rem 0.6rem;
  border-radius: 8px;
  border: 1px solid var(--line);
  color: var(--ink);
  text-decoration: none;
  font-size: 0.78rem;
  font-weight: 700;
  transition: border-color 0.15s ease, color 0.15s ease;
}

.site-link:hover,
.site-link:focus-visible {
  border-color: var(--accent);
  color: var(--accent);
  outline: none;
}

.event-row {
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  align-items: center;
  gap: 0.5rem;
  padding: 0.55rem 0.6rem;
  border-radius: 9px;
  text-decoration: none;
  color: inherit;
  border: 1px solid var(--line);
  transition: border-color 0.15s ease, background 0.15s ease;
}

a.event-row:hover,
a.event-row:focus-visible {
  border-color: var(--accent);
  background: var(--surface-2);
  outline: none;
}

.event-row.is-past {
  opacity: 0.55;
  border-style: dashed;
}

.event-date {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--ink-dim);
  min-width: 2.6em;
}

.event-type {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  padding: 0.15rem 0.45rem;
  border-radius: 999px;
  color: #fff;
  white-space: nowrap;
}
.type-closed { background: var(--type-closed); }
.type-hours  { background: var(--type-hours); }
.type-area   { background: var(--type-area); }
.type-set    { background: var(--type-set); }
.type-event  { background: var(--type-event); }

.event-note {
  font-size: 0.82rem;
  line-height: 1.35;
  min-width: 0;
  overflow-wrap: break-word;
}

.event-arrow {
  color: var(--accent);
  font-size: 0.85rem;
  width: 16px;
  height: 16px;
  display: block;
}

.event-arrow svg {
  width: 16px;
  height: 16px;
  display: block;
}

footer.note {
  padding: 1.5rem 1.25rem 0;
  text-align: center;
}

footer.note .generated {
  margin: 0;
  font-size: 0.72rem;
  color: var(--ink-dim);
}

footer.note .disclaimer {
  margin: 0.4rem 0 0;
  font-size: 0.66rem;
  line-height: 1.5;
  color: var(--ink-dim);
  opacity: 0.8;
}

footer.note .contact {
  margin: 0.6rem 0 0;
  font-size: 0.66rem;
  line-height: 1.6;
  color: var(--ink-dim);
  opacity: 0.8;
  overflow-wrap: break-word;
}

footer.note .contact a {
  color: var(--accent);
}

.tabbar {
  position: fixed;
  left: 50%;
  bottom: 0;
  width: 100%;
  max-width: 560px;
  transform: translateX(-50%);
  z-index: 20;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.tab-btn {
  flex: 1;
  min-height: 72px;
  border: none;
  background: none;
  padding: 0.55rem 0.3rem 0.3rem;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  font-family: inherit;
  cursor: pointer;
}

.tab-pill {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.15rem;
  padding: 0.4rem 0.9rem;
  border-radius: 999px;
  font-size: 0.66rem;
  font-weight: 700;
  color: var(--ink-dim);
  transition: background-color 0.15s ease, color 0.15s ease;
}

.tab-btn.active .tab-pill {
  background: var(--accent-tint);
  color: var(--accent);
}

.tab-icon {
  width: 24px;
  height: 24px;
  display: block;
}

.tab-icon svg {
  width: 24px;
  height: 24px;
  display: block;
}

.tab-icon .icon-solid { display: none; }
.tab-btn.active .tab-icon .icon-outline { display: none; }
.tab-btn.active .tab-icon .icon-solid { display: block; }

/* 検索アイコンはoutline/solidの塗り面積差により、solid切替時に一回り小さく見えるため補正する。 */
.tab-btn[data-tab="search"] .tab-icon .icon-solid {
  transform: scale(1.15);
  transform-origin: 50% 50%;
}

.tab-label {
  line-height: 1;
}

@media (max-width: 360px) {
  .info-grid { grid-template-columns: 1fr; }
  .event-row { grid-template-columns: auto auto 1fr; }
  .event-arrow { display: none; }
}
</style>

  <header class="masthead">
    <h1 id="tab-title">マイリスト</h1>
    <div class="menu-wrap" id="mylist-menu-wrap">
      <button type="button" id="mylist-menu-btn" class="menu-btn" aria-haspopup="true" aria-expanded="false" aria-label="メニュー">&#8943;</button>
      <div class="menu-popover" id="mylist-menu" hidden></div>

  <main id="tab-mylist" class="tab-panel"></main>

    var tabBtn = e.target.closest(".tab-btn");
    if (tabBtn) {
      switchTab(tabBtn.getAttribute("data-tab"));
      return;
    }
    var gotoTabBtn = e.target.closest("[data-goto-tab]");
    if (gotoTabBtn) {
      switchTab(gotoTabBtn.getAttribute("data-goto-tab"));
      return;
    }
    var chainBtn = e.target.closest(".chain-btn");
    if (chainBtn) {
      searchState.chain = chainBtn.getAttribute("data-chain");
      renderSearchTab();
      return;
    }
    var favBtn = e.target.closest("[data-fav-toggle]");
    if (favBtn) {
      toggleFavorite(favBtn.getAttribute("data-fav-toggle"));
      renderMyListTab();
      renderSearchCards();
      return;
    }
    var menuBtn = e.target.closest("#mylist-menu-btn");
    if (menuBtn) {
      toggleMylistMenu();
      return;
    }
    var sortItem = e.target.closest(".menu-item[data-sort]");
    if (sortItem) {
      setSortOrder(sortItem.getAttribute("data-sort"));
      toggleMylistMenu(false);
      renderMyListTab();
      return;
    }
    var clearBtn = e.target.closest("#mylist-clear-btn");
    if (clearBtn) {
      toggleMylistMenu(false);
      if (window.confirm("マイリストを全て削除しますか？")) {
        setFavoriteIds([]);
        renderMyListTab();
        renderSearchCards();
      }
      return;
    }
    var insideMenu = e.target.closest("#mylist-menu-wrap");
    if (!insideMenu) {
      var menu = document.getElementById("mylist-menu");
      if (!menu.hidden) toggleMylistMenu(false);
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "search-input") {
      searchState.query = e.target.value;
      renderSearchCards();
    }
  });

  // =========================================================
  // 初期描画
  // マイリストが空なら検索タブ、1件以上あればマイリストタブを表示する。
  // =========================================================
  switchTab(getFavoriteIds().length > 0 ? "mylist" : "search");
  renderSearchTab();
})();
</script>
